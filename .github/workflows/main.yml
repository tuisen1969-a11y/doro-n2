name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          # Detect the build root (directory containing the settings file),
          # supporting both "project at repo root" and "project in a subfolder".
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            BUILD_ROOT="."
          else
            FOUND=$(find . -maxdepth 4 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "*/node_modules/*" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "::error::settings.gradle(.kts) not found anywhere in the repository"
              ls -la
              exit 1
            fi
            BUILD_ROOT=$(dirname "$FOUND")
          fi
          echo "Using build root: $BUILD_ROOT"
          cd "$BUILD_ROOT"
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tello-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
